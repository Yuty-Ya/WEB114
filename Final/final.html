<!DOCTYPE html>
<html lang="en">
    <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title> Final/Coin tosser </title>
   <script src="final.js" defer></script>
   <link rel="stylesheet" href="final.css">
   </head>
   <body>
    <h1>coin toss. (FINAL)</h1>

    <section id="valuesandstuff">
        <p>spin count: <input type="number" id="spinner" value="5" min="1"></p> 
        <p>amount of colors: <input type="number" id="colors" value="2" min="2" max="6"></p>
        <p>spin time: <input type="number" id="spining" value="2" min="1"></p> 
        <p>auto spin: <input type="checkbox" id="theautospin"></p>
        <!-- go back and fix id's to something serious -->
         <!-- i forgot to add limits. found that out the hard way -->
    </section>

    <main>
        <div id="coin">Coin</div>
        <button id="themainbutton">Coin!</button>
        <p id="resulttext">cilck the button please</p>
    </main>

    <section id="scores">
        <h2>How many times the coin has landed on:</h2>
        <div id="scorelist"></div>
    </section>

   </body>
</html>
